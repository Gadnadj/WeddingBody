# Visite le serveur toutes les 5 minutes pour qu'il ne s'endorme pas (offre gratuite de Render).
name: Garder le serveur éveillé

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le serveur
        run: |
          curl -sS --max-time 90 --retry 3 --retry-delay 10 https://weddingbody.onrender.com/api/health \
            || echo "Pas de réponse du serveur"
